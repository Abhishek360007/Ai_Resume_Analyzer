# Render Blueprint for AI Resume Analyzer
# Deploy: https://render.com/deploy?repo=https://github.com/Abhishek360007/Ai_Resume_Analyzer
#
# Creates a Docker web service that serves both the API and the React frontend.
# The database is an external PostgreSQL such as Neon (free, does not expire, supports
# pgvector, which the Flyway migration enables). Render's free database is deleted after
# 30 days, so it is not used. Set DB_HOST, DB_NAME, DB_USERNAME and DB_PASSWORD from the
# Neon connection details in the service's Environment tab.
# The AI provider is Google Gemini (free tier, key from https://aistudio.google.com/apikey).
# Set GEMINI_API_KEY in the service's Environment tab. To use OpenAI instead, set
# SPRING_PROFILES_ACTIVE=openai and OPENAI_API_KEY.

services:
  - type: web
    name: ai-resume-analyzer
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      # Fit the JVM into the 512 MB instance. The free instance has ~0.1 CPU, so limit the
      # JIT to its quick C1 tier: C2 compilation otherwise competes with startup for CPU
      # and makes cold starts (after the instance sleeps) several times slower.
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -Xss512k -XX:+ExitOnOutOfMemoryError -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -Dspring.jmx.enabled=false"
      - key: PEKKO_WORKERS
        value: "2"
      # Use Neon's direct host (without "-pooler"); the app pools its own connections
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: DB_POOL_SIZE
        value: "10"
