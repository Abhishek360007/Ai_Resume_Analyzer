# Render Blueprint for AI Resume Analyzer
# Deploy: https://render.com/deploy?repo=https://github.com/Abhishek360007/Ai_Resume_Analyzer
#
# Creates a PostgreSQL database (pgvector is enabled by the Flyway migration)
# and a Docker web service that serves both the API and the React frontend.
# The AI provider is Google Gemini (free tier, key from https://aistudio.google.com/apikey).
# Set GEMINI_API_KEY in the service's Environment tab. To use OpenAI instead, set
# SPRING_PROFILES_ACTIVE=openai and OPENAI_API_KEY.

databases:
  - name: resume-analyzer-db
    databaseName: resume_analyzer
    user: resume_analyzer
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: ai-resume-analyzer
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      # Fit the JVM into the 512 MB instance. The free instance has ~0.1 CPU, so limit the
      # JIT to its quick C1 tier: C2 compilation otherwise competes with startup for CPU
      # and makes cold starts (after the instance sleeps) several times slower.
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -Xss512k -XX:+ExitOnOutOfMemoryError -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -Dspring.jmx.enabled=false"
      - key: PEKKO_WORKERS
        value: "2"
      - key: DB_HOST
        fromDatabase:
          name: resume-analyzer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: resume-analyzer-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: resume-analyzer-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: resume-analyzer-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: resume-analyzer-db
          property: password
